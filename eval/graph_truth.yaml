# Dependency-edge ground truth. AUTHORSHIP: written by Claude by reading the import statements of each file in the
# closed file sets below (grep of `import` / `from` lines, checked against the sources), before any graph evaluation.
# Direction: [importer, imported]. Only static imports between the listed files count; imports of external packages,
# stdlib, vendored code (skipped by the analyser) and string paths passed to child processes are out of scope.
version: 1
repos:
  - repo: pallets/itsdangerous
    files:
      - src/itsdangerous/__init__.py
      - src/itsdangerous/_json.py
      - src/itsdangerous/encoding.py
      - src/itsdangerous/exc.py
      - src/itsdangerous/serializer.py
      - src/itsdangerous/signer.py
      - src/itsdangerous/timed.py
      - src/itsdangerous/url_safe.py
    edges:
      - [src/itsdangerous/encoding.py, src/itsdangerous/exc.py]
      - [src/itsdangerous/__init__.py, src/itsdangerous/encoding.py]
      - [src/itsdangerous/__init__.py, src/itsdangerous/exc.py]
      - [src/itsdangerous/__init__.py, src/itsdangerous/serializer.py]
      - [src/itsdangerous/__init__.py, src/itsdangerous/signer.py]
      - [src/itsdangerous/__init__.py, src/itsdangerous/timed.py]
      - [src/itsdangerous/__init__.py, src/itsdangerous/url_safe.py]
      - [src/itsdangerous/url_safe.py, src/itsdangerous/_json.py]
      - [src/itsdangerous/url_safe.py, src/itsdangerous/encoding.py]
      - [src/itsdangerous/url_safe.py, src/itsdangerous/exc.py]
      - [src/itsdangerous/url_safe.py, src/itsdangerous/serializer.py]
      - [src/itsdangerous/url_safe.py, src/itsdangerous/timed.py]
      - [src/itsdangerous/signer.py, src/itsdangerous/encoding.py]
      - [src/itsdangerous/signer.py, src/itsdangerous/exc.py]
      - [src/itsdangerous/timed.py, src/itsdangerous/encoding.py]
      - [src/itsdangerous/timed.py, src/itsdangerous/exc.py]
      - [src/itsdangerous/timed.py, src/itsdangerous/serializer.py]
      - [src/itsdangerous/timed.py, src/itsdangerous/signer.py]
      - [src/itsdangerous/serializer.py, src/itsdangerous/encoding.py]
      - [src/itsdangerous/serializer.py, src/itsdangerous/exc.py]
      - [src/itsdangerous/serializer.py, src/itsdangerous/signer.py]
  - repo: chalk/chalk
    files:
      - source/index.js
      - source/utilities.js
      - test/chalk.js
      - test/instance.js
      - test/level.js
      - test/visible.js
      - test/no-color-support.js
      - test/_fixture.js
      - test/_force-color-fixture.js
      - test/force-color.js
    edges:
      - [source/index.js, source/utilities.js]
      - [test/chalk.js, source/index.js]
      - [test/instance.js, source/index.js]
      - [test/level.js, source/index.js]
      - [test/visible.js, source/index.js]
      - [test/no-color-support.js, source/index.js]
      - [test/_fixture.js, source/index.js]
      - [test/_force-color-fixture.js, source/index.js]
  - repo: sindresorhus/p-limit
    files: [index.js, index.d.ts, test.js, benchmark.js, scripts/benchmarker.js]
    edges:
      - [test.js, index.js]
      - [benchmark.js, index.js]
      - [benchmark.js, scripts/benchmarker.js]
  - repo: psf/requests
    # help.py is excluded: its `from . import __version__` is ambiguous (module vs the string re-exported by __init__).
    # Edges include imports under `if TYPE_CHECKING:` (they are real static import statements).
