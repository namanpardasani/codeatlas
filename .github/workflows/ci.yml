name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_USER: codeatlas
  POSTGRES_PASSWORD: ci-only-password
  POSTGRES_DB: codeatlas
  DATABASE_URL: postgres://codeatlas:ci-only-password@127.0.0.1:5432/codeatlas
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  node:
    name: Node (${{ matrix.app }}) lint + test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [api, mcp, web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: codeatlas, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: codeatlas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codeatlas" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Type-check (lint)
        run: npm run lint
      - name: Apply database migrations
        if: matrix.app != 'web'
        working-directory: .
        run: for f in db/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Read-only role for the MCP tests
        if: matrix.app == 'mcp'
        env:
          MCP_DB_PASSWORD: ci-only-mcp-password-123
        run: npx tsx src/admin.ts setup-role
      - name: Test
        if: matrix.app != 'web'
        env:
          MCP_DATABASE_URL: postgres://codeatlas_mcp:ci-only-mcp-password-123@127.0.0.1:5432/codeatlas
        run: npm test
      - name: Build
        if: matrix.app == 'web' || matrix.app == 'api'
        run: npm run build

  python:
    name: Python worker tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: codeatlas, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: codeatlas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codeatlas" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: workers/analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: workers/analyzer/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Byte-compile (syntax lint)
        # tests/fixtures holds files that are broken ON PURPOSE (parser error handling), so they are not compiled
        run: uv run python -m compileall -q -x 'tests/fixtures' analyzer tests
      - name: Apply migrations
        run: uv run python -m analyzer.migrate
      - name: Test
        run: uv run pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: App image (API + web)
        uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Worker image
        uses: docker/build-push-action@v6
        with: { context: ., file: workers/analyzer/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Compose file is valid
        run: POSTGRES_USER=u POSTGRES_PASSWORD=p POSTGRES_DB=d docker compose --profile app config -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (production dependencies)
        run: |
          for app in api mcp web; do
            (cd apps/$app && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high)
          done
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit
        working-directory: workers/analyzer
        run: |
          uv export --frozen --no-dev --no-hashes -o /tmp/req.txt
          uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip
