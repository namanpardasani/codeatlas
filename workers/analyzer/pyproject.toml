[project]
name = "codeatlas-analyzer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "pathspec>=0.12",
  "tree-sitter==0.25.2",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
  "networkx>=3.7",
  "fastembed>=0.9.0",
  "httpx>=0.28.1",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "scipy>=1.18.1",
]

[tool.uv]
# fastembed 0.9.0 (the latest) caps pillow below 13, but pillow 12.3 has 37 published advisories (image parsing; fixed in
# 13.0.0). We only embed TEXT, never images, so fastembed's image code path is unused; the override takes the fixed version.
# Verified: fastembed imports, a real text embedding still runs and the whole test suite passes. Drop this once fastembed
# lifts its cap.
override-dependencies = ["pillow>=13.0.0"]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
